services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jungle}
      POSTGRES_USER: ${POSTGRES_USER:-jungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jungle-local-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--health-enabled=true", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-password}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == *200* ]]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  localstack:
    image: jungle-localstack:4.8.1
    build:
      context: ./deploy/localstack
      dockerfile: Dockerfile
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_NAME: ${SQS_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_OUTPUT_QUEUE_NAME: ${SQS_OUTPUT_QUEUE_NAME:-wager-events.fifo}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
    ports:
      - "4566:4566"
    healthcheck:
      test:
        - CMD-SHELL
        - awslocal sqs get-queue-url --queue-name "$${SQS_QUEUE_NAME:-wager-transactions.fifo}" >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.24.4"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-jungle}:${POSTGRES_PASSWORD:-jungle-local-password}@postgres:5432/${POSTGRES_DB:-jungle}?sslmode=disable
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/${SQS_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_URL: http://localstack:4566/000000000000/${SQS_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_OUTPUT_QUEUE_URL: http://localstack:4566/000000000000/${SQS_OUTPUT_QUEUE_NAME:-wager-events.fifo}
      OIDC_ISSUER_URL: http://localhost:8081/realms/jungle-local
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-jungle-api}
      OIDC_INTERNAL_URL: http://keycloak:8080
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-15s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
